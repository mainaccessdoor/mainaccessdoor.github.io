<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ if not .IsHome }}{{ .Title }} - {{ end }}{{ .Site.Title }}</title>
    {{ $metatag := site.GetPage "/metatag" }}

    <meta name = "title" content = "{{ $metatag.Params.title }}" />
    <meta name="description" content = "{{ $metatag.Params.description }}" />
    <meta name = "og:title" content = "{{ $metatag.Params.title }}" />
    <meta name="og:description" content = "{{ $metatag.Params.description }}" />
    <meta property="og:image" content="{{ $metatag.Params.image }}" />

    <link rel="icon" type="image/x-icon" href="{{ $metatag.Params.favicon }}" />
    <link rel="stylesheet" href="/css/style.css" type="text/css" media="all" />
    <link
        rel="preload"
        href="/fonts/Director-Regular.woff2"
        as="font"
        type="font/woff2"
    />
    <link
        rel="preload"
        href="/fonts/Director-Bold.woff2"
        as="font"
        type="font/woff2"
    />
    <link
        rel="preload"
        href="/fonts/Director-Light.woff2"
        as="font"
        type="font/woff2"
    />
    <link
        rel="preload"
        href="/fonts/SM3신신명조.woff2"
        as="font"
        type="font/woff2"
    />
    {{ with .OutputFormats.Get "rss" -}} {{ printf `
    <link rel="%s" type="%s" href="%s" title="%s" />
    ` .Rel .MediaType.Type .Permalink $.Site.Title | safeHTML }} {{ end -}}
</head>
