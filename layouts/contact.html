<html lang="en">
    {{ partial "head.html" . }}
    <body>
        <div class="container contact">
            {{ partial "nav.html" . }}
            <main>
                <ul>
                    <li>
                        <a href="mailto:{{ .Params.email.address }}">
                            {{ .Params.email.text }}
                        </a>
                    </li>

                
                {{ range .Params.sns }}
                    <li>
                        <a href="{{ .url }}" target="_blank" rel="noopener noreferrer">
                            {{ .text }}
                        </a>
                    </li>
                {{ end }}
                </ul>
            </main>
        </div>
    </body>
</html>
